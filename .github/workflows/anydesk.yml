name: Ubuntu Desktop with AnyDesk

on:
  workflow_dispatch: # Allows you to manually trigger this from the Actions tab

jobs:
  run-anydesk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Desktop Environment & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xvfb curl gnupg2

      - name: Install AnyDesk
        run: |
          # 1. Download and trust the official AnyDesk repository signature key securely
          curl -fsSL https://anydesk.com | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          
          # 2. Add the authentic AnyDesk deb repository server
          echo "deb http://anydesk.com all main" | sudo tee /etc/apt/sources.list.d/anydesk-stable.list
          
          # 3. Refresh apt indices and install the software
          sudo apt-get update
          sudo apt-get install -y anydesk

      - name: Configure AnyDesk & Password
        run: |
          # 1. Launch a virtual display session so AnyDesk has an active X-server GUI environment
          Xvfb :1 -screen 0 1024x768x16 &
          export DISPLAY=:1
          
          # 2. Restart the AnyDesk system background daemon service
          sudo systemctl stop anydesk || true
          sudo systemctl start anydesk
          
          # 3. Assign your custom unattended security access password
          echo "YourSecurePassword123" | sudo anydesk --set-password

      - name: Retrieve AnyDesk ID
        run: |
          export DISPLAY=:1
          echo "=================================================="
          echo "Waiting for AnyDesk to generate ID from servers..."
          echo "=================================================="
          
          # Loop checks registration status until it switches to 'online' or ready
          for i in {1..15}; do
            STATUS=$(sudo anydesk --get-status 2>/dev/null || echo "offline")
            ANYDESK_ID=$(sudo anydesk --get-id 2>/dev/null || echo "")
            
            # If ID is generated and contains numbers, break out of loop
            if [[ -n "$ANYDESK_ID" && "$ANYDESK_ID" =~ [0-9] ]]; then
               break
            fi
            
            echo "Attempt $i: Status is '$STATUS'. Waiting for ID generation..."
            sleep 4
          done

          # Fetch the final unique registration ID
          FINAL_ID=$(sudo anydesk --get-id)
          
          echo "=================================================="
          echo "YOUR ANYDESK ID IS: $FINAL_ID"
          echo "=================================================="
          
          # Guard check: stop the workflow early if the server failed to provide an ID
          if [ -z "$FINAL_ID" ]; then
            echo "Error: AnyDesk failed to assign a connection ID in time."
            exit 1
          fi

      - name: Keep Runner Alive
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60 # Keeps runner active for up to an hour
